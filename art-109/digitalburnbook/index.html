<div id="desktop">
    <div class="book-container">
        <div class="book-spine"></div>
        <link rel="stylesheet" href="style.css">
        
        <div class="page left-page">
            <h2 class="page-title">Digital Burn Book</h2>
            <p class="instruction">Write your thoughts, then let them dissolve...</p>
            <textarea id="entry-area" placeholder="Start typing here..."></textarea>
            <div class="button-wrapper">
                <button id="burn-button">BURN ENTRY</button>
            </div>
        </div>

        <div class="page right-page">
            <div class="decoration-area">
                <div class="sticker-space">
                    <p class="handwritten">""</p>
                </div>
            </div>
        </div>
    </div>
</div>
